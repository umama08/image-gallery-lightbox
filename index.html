<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio - Image Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Portfolio Gallery</h1>
        <p>A collection of my recent projects</p>
    </header>

    <main class="gallery-container" id="gallery">
        <!-- Images injected by JS -->
    </main>

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
        <span class="close-btn" id="close-btn" role="button" tabindex="0" aria-label="Close">&times;</span>
        <button class="nav-btn prev-btn" id="prev-btn" aria-label="Previous image">&#10094;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Lightbox Image">
        </div>
        <button class="nav-btn next-btn" id="next-btn" aria-label="Next image">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
